<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="50" fill="#000000"/>

  <g clip-path="url(#c)">
    <!-- Piano body -->
    <rect x="-5" y="18" width="110" height="68" fill="#2c1810"/>

    <!-- White keys (C D E F G A B) — 14px wide, 1px gap, spanning full width -->
    <rect x="-2" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="13" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="28" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="43" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="58" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="73" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>
    <rect x="88" y="22" width="14" height="60" rx="2" fill="#f0f0f0"/>

    <!-- Black keys (C# D# — F# G# A#) -->
    <rect x="8"  y="22" width="10" height="36" rx="2" fill="#1a1a1a"/>
    <rect x="23" y="22" width="10" height="36" rx="2" fill="#1a1a1a"/>
    <rect x="53" y="22" width="10" height="36" rx="2" fill="#1a1a1a"/>
    <rect x="68" y="22" width="10" height="36" rx="2" fill="#1a1a1a"/>
    <rect x="83" y="22" width="10" height="36" rx="2" fill="#1a1a1a"/>
  </g>
</svg>
