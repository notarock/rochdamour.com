<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="50" fill="#000000"/>

  <g clip-path="url(#c)">
    <!-- Sun rays -->
    <g stroke="#ffd97d" stroke-width="3.5" stroke-linecap="round">
      <line x1="74" y1="50" x2="90" y2="50"/>
      <line x1="67" y1="67" x2="78" y2="78"/>
      <line x1="50" y1="74" x2="50" y2="90"/>
      <line x1="33" y1="67" x2="22" y2="78"/>
      <line x1="26" y1="50" x2="10" y2="50"/>
      <line x1="33" y1="33" x2="22" y2="22"/>
      <line x1="50" y1="26" x2="50" y2="10"/>
      <line x1="67" y1="33" x2="78" y2="22"/>
    </g>

    <!-- Sun body -->
    <circle cx="50" cy="50" r="20" fill="#ffd97d"/>

    <!-- Cloud (bottom-right) -->
    <circle cx="60" cy="80" r="11" fill="#ffffff"/>
    <circle cx="73" cy="72" r="15" fill="#ffffff"/>
    <circle cx="86" cy="80" r="11" fill="#ffffff"/>
    <rect x="50" y="79" width="50" height="16" fill="#ffffff"/>
  </g>
</svg>
